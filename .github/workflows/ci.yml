name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ai-rebuild-critical

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: learn-up

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: learn-up/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply chat state migration
        working-directory: .
        run: |
          if [ -f scripts/fix-chat-state.mjs ]; then
            node scripts/fix-chat-state.mjs
            if ! git diff --quiet -- learn-up/src/components/AIChatComponent.tsx learn-up/src/components/JournalSidebar.tsx learn-up/src/components/RecipeSidebar.tsx learn-up/src/components/NotebookWhiteboard.tsx learn-up/src/actions/ai-tutor.ts; then
              git config user.name "learn-up-ci"
              git config user.email "actions@github.com"
              git add learn-up/src/components/AIChatComponent.tsx learn-up/src/components/JournalSidebar.tsx learn-up/src/components/RecipeSidebar.tsx learn-up/src/components/NotebookWhiteboard.tsx learn-up/src/actions/ai-tutor.ts
              git commit -m "fix(ai): wire chat state and interactive panels"
              git push
            fi
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://learn-up-qmgx.onrender.com
          AI_PROVIDER: gemini
