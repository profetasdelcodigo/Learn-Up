name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: learn-up
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learn-up/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply final AI hardening once
        working-directory: .
        run: |
          changed=0
          for script in scripts/finalize-ai.mjs scripts/fix-lint-blockers.mjs scripts/fix-runtime-critical.mjs; do
            if [ -f "$script" ]; then
              node "$script"
              changed=1
            fi
          done
          if [ "$changed" = "1" ] && ! git diff --quiet; then
            git config user.name "learn-up-ci"
            git config user.email "actions@github.com"
            git add learn-up/src scripts
            git commit -m "fix(ai): finalize production agent runtime"
            git push
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://learn-up-qmgx.onrender.com
          AI_PROVIDER: gemini
