name: maintenance-ai-runtime-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'profetasdelcodigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chat = Path('learn-up/src/components/AIChatComponent.tsx')
          text = chat.read_text()
          old = 'nodes.push(text.slice(lastIndex, match.index));'
          new = 'nodes.push(mainText.slice(lastIndex, match.index));'
          if old in text:
              text = text.replace(old, new, 1)
              chat.write_text(text)
              print('AIChat trace leak fixed.')
          else:
              print('AIChat trace leak patch already applied.')

          wf = Path('learn-up/src/lib/ai/workflow-agent.ts')
          text = wf.read_text()
          old = '    const raw = response.choices[0]?.message?.content || "";\n    const parsed = parseWorkflowToolCalls(raw);\n    const text = parsed.cleanText;\n    const actions = (await Promise.all(parsed.actions.map((action) => normalizeActionArgs(action, options.userId)))).map(normalizeAction).filter((action) => !executedSignatures.has(actionSignature(action)));'
          new = '''    const messagePayload: any = response.choices[0]?.message || {};\n    const raw = typeof messagePayload.content === "string" ? messagePayload.content : "";\n    const parsed = parseWorkflowToolCalls(raw);\n    const structuredActions: ToolAction[] = Array.isArray(messagePayload.tool_calls)\n      ? messagePayload.tool_calls.flatMap((call: any) => {\n          const name = call?.function?.name || call?.name || call?.tool;\n          if (typeof name !== "string" || !name.trim()) return [];\n          const rawArgs = call?.function?.arguments ?? call?.arguments ?? call?.args ?? {};\n          let args: Record<string, any> = {};\n          try {\n            args = typeof rawArgs === "string" ? JSON.parse(rawArgs) : (rawArgs && typeof rawArgs === "object" ? rawArgs : {});\n          } catch {\n            return [];\n          }\n          return [{ tool: name.trim(), args, description: call?.function?.description || call?.description, requiresConfirm: undefined } as ToolAction];\n        })\n      : [];\n    const mergedParsedActions = [...parsed.actions, ...structuredActions];\n    const dedupedParsedActions = [...new Map(mergedParsedActions.map((action) => [actionSignature(action), action])).values()];\n    const text = parsed.cleanText;\n    const actions = (await Promise.all(dedupedParsedActions.map((action) => normalizeActionArgs(action, options.userId)))).map(normalizeAction).filter((action) => !executedSignatures.has(actionSignature(action)));'''
          if old in text:
              text = text.replace(old, new, 1)
              wf.write_text(text)
              print('Structured tool-call bridge patched.')
          else:
              print('Structured tool-call bridge already patched or target changed.')
          PY
      - name: Commit runtime patches
        run: |
          git config user.name 'profetasdelcodigo'
          git config user.email '255248263+profetasdelcodigo@users.noreply.github.com'
          git add learn-up/src/components/AIChatComponent.tsx learn-up/src/lib/ai/workflow-agent.ts
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'fix(ai): bridge structured tool calls and sanitize trace output'
            git push origin main
          fi
