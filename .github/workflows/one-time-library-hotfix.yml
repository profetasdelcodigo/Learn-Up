name: One-time Library upload hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(library): apply route upload hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Library client upload patch
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('learn-up/src/app/library/page.tsx')
          s = page.read_text(encoding='utf-8')

          s = s.replace(
              'import {\n  uploadLibraryFile,\n  approveLibraryItem,',
              'import {\n  approveLibraryItem,',
              1,
          )

          pattern = re.compile(
              r'  const handleSubmit = async \(e: React\.FormEvent\) => \{.*?^  \};\n\n  const handleApprove',
              re.S | re.M,
          )
          replacement = '''  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (!formData.file || !formData.title || !formData.reviewer_username) return;

    setUploading(true);
    try {
      const data = new FormData();
      data.append("file", formData.file);
      data.append("title", formData.title);
      data.append("description", formData.description);
      data.append("subject", formData.subject);
      data.append("reviewer_username", formData.reviewer_username);

      const response = await fetch("/api/library/upload", {
        method: "POST",
        credentials: "include",
        body: data,
      });
      const result = await response.json().catch(() => null);

      if (!response.ok || !result?.success) {
        throw new Error(result?.error || `No se pudo subir el material (HTTP ${response.status})`);
      }

      setShowModal(false);
      setFormData({
        title: "",
        description: "",
        subject: "",
        reviewer_username: "",
        file: null,
      });
      await loadItems();
      if (currentUserId && isDocente) await loadPendingItems(currentUserId);
      alert(
        isDocente
          ? "✅ Material publicado en la Biblioteca Pública."
          : "¡Aporte enviado! El docente revisará tu material antes de publicarlo.",
      );
    } catch (err) {
      console.error("[library] Upload error:", err);
      alert(err instanceof Error ? err.message : "No se pudo subir el material");
    } finally {
      setUploading(false);
    }
  };

  const handleApprove'''

          patched, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('No se encontró handleSubmit en Library page')
          page.write_text(patched, encoding='utf-8')

          # Remove the temporary client action alias; page.tsx now calls the
          # dedicated Route Handler directly, while the remaining server actions
          # keep their original imports.
          cfg = Path('learn-up/next.config.ts')
          c = cfg.read_text(encoding='utf-8')
          c = c.replace(
              'import { dirname, resolve } from "node:path";',
              'import { dirname } from "node:path";',
              1,
          )
          c = c.replace(
              '''  webpack: (config, { isServer }) => {
    if (!isServer) {
      config.resolve.alias = {
        ...(config.resolve.alias || {}),
        "@/actions/library": resolve(appDir, "src/client-actions/library.ts"),
      };
    }

''',
              '''  webpack: (config) => {
''',
              1,
          )
          cfg.write_text(c, encoding='utf-8')

          bridge = Path('learn-up/src/client-actions/library.ts')
          if bridge.exists():
              bridge.unlink()

      - name: Commit and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn-up/src/app/library/page.tsx learn-up/next.config.ts
          git rm .github/workflows/one-time-library-hotfix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(library): apply route upload hotfix'
          git push