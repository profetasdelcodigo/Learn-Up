name: maintenance-patch-ai-chat

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'profetasdelcodigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AI chat safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('learn-up/src/components/AIChatComponent.tsx')
          text = p.read_text()
          replacements = [
              ('import { getPersistedSkillPacks, saveSkillPacks } from "@/lib/ai/core/skill-state";', 'import { getPersistedSkillPacks, saveSkillPacks } from "@/lib/ai/core/skill-state";\nimport { ALL_PACKS } from "@/lib/ai/core/tool-catalog";'),
              ('const [activeSkills, setActiveSkills] = useState<string[]>([]);', 'const [activeSkills, setActiveSkills] = useState<string[]>([...ALL_PACKS]);'),
              ('while ((match = tokenRegex.exec(text)) !== null) {', 'while ((match = tokenRegex.exec(mainText)) !== null) {'),
          ]
          changed = False
          for old, new in replacements:
              if old in text and new not in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if not changed:
              print('No patch needed; target changes already present.')
          else:
              p.write_text(text)
              print('AIChatComponent patched.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'profetasdelcodigo'
          git config user.email '255248263+profetasdelcodigo@users.noreply.github.com'
          git add learn-up/src/components/AIChatComponent.tsx
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'fix(ai): render clean response trace and activate all skills in chat'
            git push origin main
          fi
