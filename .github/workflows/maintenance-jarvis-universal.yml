name: maintenance-jarvis-universal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'profetasdelcodigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Jarvis universal card patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('learn-up/src/components/JarvisGlobalWidget.tsx')
          text = p.read_text()

          text = text.replace(
              'import { getPersistedSkillPacks, saveSkillPacks } from "@/lib/ai/core/skill-state";',
              'import { getPersistedSkillPacks, saveSkillPacks } from "@/lib/ai/core/skill-state";\nimport { ALL_PACKS } from "@/lib/ai/core/tool-catalog";\nimport UniversalToolCard, { universalToolActionKey } from "./ai/UniversalToolCard";'
          )
          text = text.replace(
              'const [activeSkills, setActiveSkills] = useState<string[]>([]);',
              'const [activeSkills, setActiveSkills] = useState<string[]>([...ALL_PACKS]);'
          )
          text = text.replace(
              'const result = await approveStableToolAction(action.tool, action.args || {});',
              'const result = await approveStableToolAction(action.tool, action.args || {}, action.workflowId);'
          )

          start = text.find('  const renderToolCard = (action: any) => {')
          end = text.find('\n\n  if (isHidden) return null;', start)
          if start != -1 and end != -1:
              replacement = '''  const renderToolCard = (action: any) => {\n    const isPending = action?.requiresConfirm !== false;\n    const handleConfirm = async (selected: any) => {\n      await executeClientAction(selected);\n    };\n    const handleCancel = async (selected: any) => {\n      if (selected?.workflowId) {\n        const result = await cancelStableToolAction(selected.tool, selected.args || {}, selected.workflowId);\n        if (result?.response) {\n          setMessages((prev) => [...prev, { role: "assistant", content: result.response }]);\n        }\n      } else {\n        setMessages((prev) => [...prev, { role: "assistant", content: "Entendido, no realicé esa acción." }]);\n      }\n    };\n\n    return (\n      <UniversalToolCard\n        key={universalToolActionKey(action)}\n        action={action}\n        status={isPending ? "pending" : "completed"}\n        globalRecovery\n        onConfirm={isPending ? (selected) => void handleConfirm(selected) : undefined}\n        onCancel={isPending ? (selected) => void handleCancel(selected) : undefined}\n      />\n    );\n  };'''
              text = text[:start] + replacement + text[end:]
          else:
              print('renderToolCard target not found')

          p.write_text(text)
          print('Jarvis universal card patch applied.')
          PY
      - name: Commit Jarvis patch
        run: |
          git config user.name 'profetasdelcodigo'
          git config user.email '255248263+profetasdelcodigo@users.noreply.github.com'
          git add learn-up/src/components/JarvisGlobalWidget.tsx
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'fix(ai): use universal tool cards in Jarvis'
            git push origin main
          fi
