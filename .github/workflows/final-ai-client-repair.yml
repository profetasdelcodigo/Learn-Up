name: final-ai-client-repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[final-ai-client]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final client logic repair
        run: python scripts/final-ai-client-repair.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          ai = Path('learn-up/src/components/AIChatComponent.tsx').read_text(encoding='utf-8')
          j = Path('learn-up/src/components/JarvisGlobalWidget.tsx').read_text(encoding='utf-8')
          stale = [
            'openrouter/dots-studio/dots-3-note-preview:free',
            'openrouter/nvidia/nemotron-3.5-lightning:free',
            'nvidia/z-ai/glm-5.2',
            'nvidia/nemotron-3-ultra-550b-a55b',
            'Dots 3 Note',
            'Nemotron 3.5 Lightning',
            'GLM-5.2',
            'Nemotron 550B',
          ]
          for x in stale:
            assert x not in ai, f'stale model in AIChatComponent: {x}'
            assert x not in j, f'stale model in JarvisGlobalWidget: {x}'
          start = ai.find('const loadSessionMessages = async')
          end = ai.find('const getMediaType', start)
          assert start >= 0 and end > start
          assert 'setMessages([]);' not in ai[start:end]
          assert 'client_message_id' in ai
          assert 'approveStableToolAction' in ai
          assert 'cancelStableToolAction' in ai
          print('final AI client validation passed')
          PY
      - name: Commit and remove repair tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/final-ai-client-repair.yml scripts/final-ai-client-repair.py scripts/.ai-client-maintenance-trigger .github/workflows/one-shot-ai-client-logic.yml scripts/fix-ai-client-logic.py
          git add learn-up/src/components/AIChatComponent.tsx learn-up/src/components/JarvisGlobalWidget.tsx .github/workflows/final-ai-client-repair.yml scripts/final-ai-client-repair.py scripts/.ai-client-maintenance-trigger .github/workflows/one-shot-ai-client-logic.yml scripts/fix-ai-client-logic.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ai): repair skill persistence, message reconciliation, and model selector'
            git push origin main
          fi
