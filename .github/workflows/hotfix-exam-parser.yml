name: Temporary exam parser hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(exams): repair malformed AI JSON') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exam provider routing and malformed section JSON
        shell: python
        run: |
          from pathlib import Path
          p = Path('learn-up/src/actions/ai-tutor.ts')
          s = p.read_text(encoding='utf-8')

          old_provider = 'mediaUrl ? "openrouter/google/gemini-2.5-flash:free" : "nvidia/nemotron-3-ultra-550b-a55b"'
          new_provider = 'mediaUrl ? "gemini/gemini-3.8-flash" : "cloudflare/@cf/zai-org/glm-4.7-flash"'
          if old_provider in s:
              s = s.replace(old_provider, new_provider, 1)

          marker = '    let exam: ExamData;\n    try {'
          repair = '''    // Some providers occasionally emit malformed section objects such as:\n    // {"title":"Sección II", "questions", ":", [...]}\n    // Normalize that specific corruption before JSON.parse.\n    parsedContent = parsedContent.replace(\n      /},\\s*"([^"]+)"\\s*,\\s*"questions"\\s*,\\s*":"\\s*,\\s*\\[/g,\n      '},{"title":"$1","questions":['\n    );\n\n'''
          if marker in s and 'Normalize that specific corruption' not in s:
              s = s.replace(marker, repair + marker, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn-up/src/actions/ai-tutor.ts
          git rm .github/workflows/hotfix-exam-parser.yml
          git commit -m 'fix(exams): repair malformed AI JSON'
          git push