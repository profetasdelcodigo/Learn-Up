name: Temporary production hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(ai): stabilize Jarvis mobile drag and model routing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted production fixes
        shell: python
        run: |
          from pathlib import Path

          # Jarvis server routing: preserve provider prefixes instead of
          # converting groq/... and gemini/... into openrouter/... IDs.
          p = Path('learn-up/src/actions/jarvis.ts')
          s = p.read_text(encoding='utf-8')
          old = '  return raw.startsWith("openrouter/") ? raw : `openrouter/${raw}`;'
          new = '''  if (/^(groq|gemini|nvidia|cloudflare|openrouter)\\//.test(raw)) return raw;
  return `openrouter/${raw}`;'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Mobile Jarvis dragging: touch-action:none lets Framer Motion own
          # the pointer gesture on touch devices without disabling chat scroll.
          p = Path('learn-up/src/components/JarvisGlobalWidget.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'className="flex cursor-grab items-center justify-between border-b border-brand-gold/20 bg-gradient-to-r from-brand-gold/10 to-transparent px-4 py-3 active:cursor-grabbing"',
              'className="flex cursor-grab touch-none select-none items-center justify-between border-b border-brand-gold/20 bg-gradient-to-r from-brand-gold/10 to-transparent px-4 py-3 active:cursor-grabbing"',
              1,
          )
          s = s.replace(
              'className={`group relative flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-brand-gold to-yellow-600 text-black shadow-lg shadow-brand-gold/20 transition-transform hover:scale-110 active:scale-95 ${',
              'className={`group relative flex h-14 w-14 touch-none select-none items-center justify-center rounded-full bg-gradient-to-br from-brand-gold to-yellow-600 text-black shadow-lg shadow-brand-gold/20 transition-transform hover:scale-110 active:scale-95 ${',
              1,
          )
          p.write_text(s, encoding='utf-8')
      - name: Commit production fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn-up/src/actions/jarvis.ts learn-up/src/components/JarvisGlobalWidget.tsx
          git rm .github/workflows/hotfix-exam-parser.yml
          git commit -m 'fix(ai): stabilize Jarvis mobile drag and model routing'
          git push
