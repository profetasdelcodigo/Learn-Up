name: Temporary production hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply shared AI fallback and navigation safety
        shell: python
        run: |
          from pathlib import Path
          import re

          # -----------------------------------------------------------------
          # Shared AI fallback: an empty provider response is a failed
          # completion, so getAICompletion can move to the next provider.
          # -----------------------------------------------------------------
          p = Path('learn-up/src/lib/ai.ts')
          s = p.read_text(encoding='utf-8')

          retry_pattern = r'function isRetryableProviderError\(error: any\) \{.*?\n'
          retry_replacement = '''function isRetryableProviderError(error: any) { const message = String(error?.message || error || "").toLowerCase(); return /timeout|408|429|rate.?limit|temporar|overload|capacity|503|504|502|500|unavailable|network|fetch failed|abort|resource.?exhausted|server.?error|internal|model.?not.?found|no endpoints available|does not exist|not available for free|empty|blank|respuesta vac[ií]a|no devolvi[oó] contenido|sin mensaje|404/.test(message); }\n'''
          s, count = re.subn(retry_pattern, retry_replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('No se pudo localizar isRetryableProviderError en ai.ts')

          if 'function assertUsableCompletion(' not in s:
              marker = 'async function completionForModel(messages: any[], model: string, jsonMode: boolean) {'
              helper = '''function assertUsableCompletion(result: any, provider: string) {\n  const message = result?.choices?.[0]?.message;\n  const content = message?.content;\n  if (!message || typeof content !== "string" || !content.trim()) {\n    throw new Error(`${provider} devolvió una respuesta vacía.`);\n  }\n  return result;\n}\n\n'''
              if marker not in s:
                  raise SystemExit('No se encontró el punto de inserción para assertUsableCompletion')
              s = s.replace(marker, helper + marker, 1)

          old_call = '      const result = await callWithProviderRetry(() => completionForModel(messages, candidate, jsonMode));\n      const normalizedResult = normalizeJsonCompletion(result, jsonMode);'
          new_call = '      const result = assertUsableCompletion(await callWithProviderRetry(() => completionForModel(messages, candidate, jsonMode)), provider);\n      const normalizedResult = normalizeJsonCompletion(result, jsonMode);'
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          elif new_call not in s:
              raise SystemExit('No se pudo localizar la llamada de getAICompletion en ai.ts')

          p.write_text(s, encoding='utf-8')

          # -----------------------------------------------------------------
          # Prevent accidental navigation from model hallucinations. A
          # navigate_app action is ignored unless the latest user request
          # explicitly asks to navigate/open a Learn Up section.
          # -----------------------------------------------------------------
          p = Path('learn-up/src/lib/ai/workflow-agent.ts')
          s = p.read_text(encoding='utf-8')

          if 'function explicitNavigationIntent(' not in s:
              marker = 'function decideTool(action: ToolAction, mode: ToolMode): "execute" | "pending_confirmation" | "deny" {'
              helper = '''function explicitNavigationIntent(text: string) {\n  return /\\b(abre|abr[ií]|ve a|ir a|entra a|ll[eé]vame a|navega|navegar|regresa|volver|salir de|cambia a|cambiar a)\\b.*(?:secci[oó]n|p[aá]gina|ruta|inicio|dashboard|chat|profesor|consejero|recetas|examen|biblioteca|perfil|ajustes|configuraci[oó]n)/i.test(text);\n}\n\n'''
              if marker not in s:
                  raise SystemExit('No se encontró el punto de inserción para explicitNavigationIntent')
              s = s.replace(marker, helper + marker, 1)

          old_actions = '    const actions = (await Promise.all(dedupedParsedActions.map((action) => normalizeActionArgs(action, options.userId)))).map(normalizeAction).filter((action) => !executedSignatures.has(actionSignature(action)));\n    lastText = text;'
          new_actions = '''    const latestUserText = String([...currentMessages].reverse().find((message: any) => message?.role === "user")?.content || "");\n    const allowNavigation = explicitNavigationIntent(latestUserText);\n    const actions = (await Promise.all(dedupedParsedActions.map((action) => normalizeActionArgs(action, options.userId))))\n      .map(normalizeAction)\n      .filter((action) => !executedSignatures.has(actionSignature(action)))\n      .filter((action) => action.tool !== "navigate_app" || allowNavigation);\n    lastText = text;'''
          if old_actions in s:
              s = s.replace(old_actions, new_actions, 1)
          elif new_actions not in s:
              raise SystemExit('No se pudo localizar el procesamiento de acciones en workflow-agent.ts')

          p.write_text(s, encoding='utf-8')

      - name: Commit production fixes and remove this temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn-up/src/lib/ai.ts learn-up/src/lib/ai/workflow-agent.ts
          git rm .github/workflows/hotfix-exam-parser.yml
          git commit -m 'fix(ai): harden shared fallback and navigation safety'
          git push
