name: maintenance-client-skill-list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'profetasdelcodigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove server-only skill catalog import from client bundles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          DEFAULTS = '["calendar_pack", "chat_pack", "library_pack", "learning_pack", "content_pack", "media_pack", "research_pack", "stats_pack", "profile_pack", "edu_pack"]'
          for rel in ['learn-up/src/components/AIChatComponent.tsx', 'learn-up/src/components/JarvisGlobalWidget.tsx']:
              p = Path(rel)
              text = p.read_text()
              text = text.replace('import { ALL_PACKS } from "@/lib/ai/core/tool-catalog";\n', '')
              text = text.replace('import UniversalToolCard, { universalToolActionKey } from "./ai/UniversalToolCard";\n', 'import UniversalToolCard, { universalToolActionKey } from "./ai/UniversalToolCard";\n' if 'UniversalToolCard' in text else 'import UniversalToolCard, { universalToolActionKey } from "./ai/UniversalToolCard";\n')
              marker = 'interface ToolAction {' if 'AIChatComponent' in rel else 'const JarvisOrb3D = dynamic('
              if 'const DEFAULT_ACTIVE_SKILLS' not in text:
                  insert = f'const DEFAULT_ACTIVE_SKILLS = {DEFAULTS};\n\n'
                  if marker in text:
                      text = text.replace(marker, insert + marker, 1)
                  else:
                      text = text.replace('const JarvisOrb3D = dynamic(', insert + 'const JarvisOrb3D = dynamic(', 1)
              text = text.replace('[...ALL_PACKS]', '[...DEFAULT_ACTIVE_SKILLS]')
              p.write_text(text)
              print(f'Patched {rel}')
          PY
      - name: Commit client-safe patch
        run: |
          git config user.name 'profetasdelcodigo'
          git config user.email '255248263+profetasdelcodigo@users.noreply.github.com'
          git add learn-up/src/components/AIChatComponent.tsx learn-up/src/components/JarvisGlobalWidget.tsx
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'fix(ai): keep universal skill defaults client-safe'
            git push origin main
          fi
